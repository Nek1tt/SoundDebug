name: sounddebug

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: HS256
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/SoundDebug.Frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      UPLOAD_SERVICE_URL: http://upload-service:8002
      REPORT_SERVICE_URL: http://report-service:8003
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
    expose: ["8000"]
    depends_on:
      auth-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment: *common-env
    expose: ["8001"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      STEM_ANALYSIS_DEFAULT: ${STEM_ANALYSIS_DEFAULT:-false}
    expose: ["8002"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    restart: unless-stopped
    environment: *common-env
    expose: ["8003"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dsp-worker:
    build:
      context: .
      dockerfile: services/workers/dsp_worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: uploads
      REPORT_SERVICE_URL: http://report-service:8003
      MAX_AUDIO_DURATION_SEC: ${MAX_AUDIO_DURATION_SEC:-900}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      OMP_NUM_THREADS: ${DEMUCS_CPU_THREADS:-4}
    volumes:
      - demucs_cache:/root/.cache/torch
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      report-service:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init_db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -f
      - /schema/001-init.sql
    volumes:
      - ./infra/scripts/init_db.sql:/schema/001-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose: ["9000"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  demucs_cache:
