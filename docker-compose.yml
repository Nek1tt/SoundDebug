version: "3.9"

services:

  # ─────────────────────────────────────────────
  # БАЗЫ ДАННЫХ И ИНФРАСТРУКТУРА
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: music_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-musicdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-musicdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: music_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: music_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # МИКРОСЕРВИСЫ
  # ─────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: music_auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-musicdb}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    container_name: music_upload
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-musicdb}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: uploads
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_ALGORITHM: HS256
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: music_report
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-musicdb}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_ALGORITHM: HS256
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: music_gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      UPLOAD_SERVICE_URL: http://upload-service:8002
      REPORT_SERVICE_URL: http://report-service:8003
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_ALGORITHM: HS256
    ports:
      - "8000:8000"   # ← Единственный публичный порт для фронтенда
    depends_on:
      - auth-service
      - upload-service
      - report-service

  dsp-worker:
    build:
      context: .
      dockerfile: services/workers/dsp_worker/Dockerfile
    container_name: music_dsp_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-musicdb}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: uploads
      REPORT_SERVICE_URL: http://report-service:8003
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      report-service:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
